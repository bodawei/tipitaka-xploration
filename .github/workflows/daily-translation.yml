name: Daily Tipitaka Translation

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      chunk_size:
        description: 'Number of verses to translate (overrides the CHUNK_SIZE repo variable)'
        required: false
        type: string
      providers:
        description: 'Optional space-separated subset of the providers enabled in translation/state/providers.json, e.g. "claude kimi"'
        required: false
        type: string
      dry_run:
        description: 'Dry run: skip translation/email calls and just log the selected chunk'
        required: false
        type: boolean
        default: false
      summarize_verse:
        description: 'Backfill only: re-send the section summary for the section containing this verse ("123" or "file.mul.xml:123"). Skips translation and leaves the saved position untouched.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    env:
      SOURCE_DIR: romn
      STATE_FILE: translation/state/translation-progress.json
      PROVIDERS_FILE: translation/state/providers.json
      TRANSLATION_DIR: translation/results
      GLOSSARY_DIR: translation
      CHUNK_SIZE: ${{ inputs.chunk_size || vars.CHUNK_SIZE || '20' }}
      # Per-provider on/off switches live in PROVIDERS_FILE. This optional
      # input only narrows the enabled set for a single run; it cannot enable
      # a provider that is switched off in the state file.
      PROVIDERS: ${{ inputs.providers }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-5' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      KIMI_MODEL: ${{ vars.KIMI_MODEL || 'kimi-k2.6' }}
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-flash' }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      DRY_RUN: ${{ (inputs.dry_run && '1') || '0' }}
      SUMMARIZE_VERSE: ${{ inputs.summarize_verse }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run daily translation
        run: python translation/scripts/daily_translate.py

      # Runs even when the translation step failed, so that an email spooled
      # for retry (translation/state/pending-email/) survives to the next run —
      # the runner's checkout is thrown away, so an uncommitted spool is lost.
      - name: Commit updated progress state
        if: ${{ !cancelled() && env.DRY_RUN != '1' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add translation/state/ translation/results/ translation/glossary-*.md
          if ! git diff --cached --quiet; then
            git commit -m "Advance translation progress [skip ci]"
            git push
          fi
